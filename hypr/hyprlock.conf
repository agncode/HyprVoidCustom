source = $HOME/.cache/wal/colors-hyprland.conf
$CITY		= Sukabumi
$COUNTRY	= Indonesia
$WALLPAPER_PATH = ~/.config/hypr/wallpaper

background {
    monitor=
    path = ~/.config/hypr/wallpaper/wallhaven2.png
    #path = $HOME/.current_wallpaper   # only png supported for now
#    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    contrast = 0.8172 # Vibrant!!!
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
   # color=rgba(17,17,17,0.4)
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(211,211,211,0.8)
    font_size = 100
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 300
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(211,211,211,0.8)
    font_size = 100
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 210
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgba(216,222,233,0.8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font 10

    position = 0, 100
    halign = center
    valign = center
}

# date(day, month, year)
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b %Y')" </b>"
    color = rgba(216,222,233,0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font 10

    position = 0, 66
    halign = center
    valign = center
}

#Profile-Photo
image{
	monitor=
	path = /home/user0/.config/hypr/hyprlock/user-img.png
	border-color = 0xffdddddd
	border-size = 0
	size = 110
	rounding = -1
	rotate = 0
	reload_time = -1
	reload_cmd =
	position = 0, 0
	halign = center
	valign = center
}

#user
label{
	monitor=
	text = $USER
	color = rgba(216,222,233,0.8)
	font-size = 20
	position = 100,0
	halign=left
	valign=center
}


# Degrees
label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = rgba(216,222,233,0.7)
    font_size = 18
    font_family = Geist Mono 10

    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    size = 170, 45
    outline_thickness = 2

    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(210,222,233,0.8)
    inner_color = rgba(100,114,125,0.2)
    font_color = rgb(200,200,200)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Enter Password...</span> # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, -220
    halign = center
    valign = center
}

